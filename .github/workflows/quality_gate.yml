  hospital-postgresql:
    name: HSP01 disposable PostgreSQL migration and recovery
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: hsp01_test
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: hsp01_ci
        ports: ["55439:5432"]
        options: >-
          --health-cmd "pg_isready -U hsp01_test -d hsp01_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: ./backend
    env:
      DATABASE_URL: postgresql+psycopg2://hsp01_test:synthetic-ci-only@127.0.0.1:55439/hsp01_ci
      SQLALCHEMY_DATABASE_URL: postgresql+psycopg2://hsp01_test:synthetic-ci-only@127.0.0.1:55439/hsp01_ci
      HSP01_TEST_DATABASE_URL: postgresql+psycopg2://hsp01_test:synthetic-ci-only@127.0.0.1:55439/hsp01_ci
      DEPLOYMENT_REGION: UAE
      CLINIC_TIMEZONE: Asia/Dubai
      SENTINEL_DISABLE_SCHEMA_AUTOCREATE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Fresh forward migrations
        run: python -B -m alembic upgrade head
      - name: Hospital concurrency, authority recovery and regressions
        run: python -B -m pytest --noconftest -p no:cacheprovider tests/integration/test_hospital_source_contract.py -v

  frontend-quality:
    name: Frontend Quality Assurance
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: F-33 Dependency Audit and Release Policy Gate
      run: |
        npm audit --json > dependency-audit.json || true
        node scripts/check-dependency-audit.js
      
    - name: Upload Dependency Audit Artifact
      uses: actions/upload-artifact@v4
      with:
        name: frontend-dependency-audit
        path: |
          frontend/dependency-audit.json
          frontend/dependency-disposition.json

    - name: Run Tests
      run: npm run test

    - name: Run Linter
      run: npm run lint

    - name: Build Application
      run: npm run build
