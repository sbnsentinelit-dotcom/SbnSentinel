name: SES-011 Quality Gate

on:
  push:
    branches: [ "main", "develop", "master" ]
  pull_request:
    branches: [ "main", "develop", "master" ]

jobs:
  backend-quality:
    name: Backend Quality Assurance
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///${{ runner.temp }}/hsp01_backend_quality.db
      SQLALCHEMY_DATABASE_URL: sqlite:///${{ runner.temp }}/hsp01_backend_quality.db
      SENTINEL_DISABLE_SCHEMA_AUTOCREATE: "1"
      SECRET_KEY: "test-secret-key-for-ci"
    
    defaults:
      run:
        working-directory: ./backend

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Migrate disposable quality database before application imports
      run: python -B -m alembic upgrade head

    - name: SES-011 Linting (Flake8)
      run: |
        flake8 src/runtime/app/ tests/

    - name: HSP01 isolated hospital regression suites
      env:
        SENTINEL_DISABLE_SCHEMA_AUTOCREATE: "1"
      run: |
        python -B -m pytest --noconftest -p no:cacheprovider tests/integration/test_hospital_directory.py tests/integration/test_hospital_source_contract.py -v

