name: SES-011 Quality Gate

on:
  push:
    branches: [ "main", "develop", "master" ]
  pull_request:
    branches: [ "main", "develop", "master" ]

jobs:
  backend-quality:
    name: Backend Quality Assurance
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./backend

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Generate Ephemeral CI Keypair
      run: |
        openssl genrsa -out /tmp/ci_rsa_key.pem 2048
        echo "JWT_PRIVATE_KEY<<EOF" >> $GITHUB_ENV
        cat /tmp/ci_rsa_key.pem >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV

    - name: Migrate disposable quality database before application imports
      run: python -B -m alembic upgrade head

    - name: SES-011 Linting (Flake8)
      run: |
        flake8 src/runtime/app/ tests/

    - name: SES-011 Unit Testing (Pytest)
      env:
        SECRET_KEY: "test-secret-key-for-ci"
        PYTHONPATH: "src/runtime"
      run: |
        pytest tests/unit/ -v -m unit

    - name: SESR-001 Governance Testing
      env:
        SECRET_KEY: "test-secret-key-for-ci"
        PYTHONPATH: "src/runtime"
      run: |
        pytest tests/ -v -k "governance"

    - name: SDS-D4 and SDS-D5 Verification
      env:
        SECRET_KEY: "test-secret-key-for-ci"
        PYTHONPATH: "src/runtime"
      run: |
        pytest tests/integration/test_d4_decision_basis.py tests/integration/test_d5_recommendation_review.py -v

    - name: SDS-D6 Verification
      env:
        SECRET_KEY: "test-secret-key-for-ci"
        PYTHONPATH: "src/runtime"
      run: |
        pytest \
          tests/integration/test_d6_action_lifecycle.py \
          tests/integration/test_d6_e2e_pipeline.py \
          tests/integration/test_d6_migration.py \
          -v

    - name: SDS-D7 Verification
      env:
        SECRET_KEY: "test-secret-key-for-ci"
        PYTHONPATH: "src/runtime"
      run: |
        pytest tests/integration/test_d7_runtime_status.py -v

    - name: SDS-D8 Verification
      env:
        SECRET_KEY: "test-secret-key-for-ci"
        PYTHONPATH: "src/runtime"
      run: |
        pytest tests/integration/test_d8_history_reproducibility.py -v

    - name: API Module Verification
      env:
        SECRET_KEY: "test-secret-key-for-ci"
        PYTHONPATH: "src/runtime"
      run: |
        pytest tests/integration/test_d9_universal_api.py tests/integration/test_d9_pf_api.py -v

    - name: Round 2 Acceptance Verification
      env:
        SECRET_KEY: "test-secret-key-for-ci"
        PYTHONPATH: "src/runtime"
      run: |
        pytest tests/integration/test_round2_acceptance.py -v

  frontend-quality:
    name: Frontend Quality Assurance
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: F-33 Dependency Audit and Release Policy Gate
      run: |
        npm audit --json > dependency-audit.json || true
        node scripts/check-dependency-audit.js
      
    - name: Upload Dependency Audit Artifact
      uses: actions/upload-artifact@v4
      with:
        name: frontend-dependency-audit
        path: |
          frontend/dependency-audit.json
          frontend/dependency-disposition.json

    - name: Run Tests
      run: npm run test

    - name: Run Linter
      run: npm run lint

    - name: Build Application
      run: npm run build
